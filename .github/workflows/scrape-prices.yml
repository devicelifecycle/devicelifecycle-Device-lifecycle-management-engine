name: Scrape Competitor Prices

on:
  schedule:
    # 11:05 UTC daily — offset slightly from Vercel crons (11:00–11:20)
    - cron: "5 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print scraped count, skip DB upsert)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  scrape:
    name: Run Scrapling workers
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scrapers_py/requirements_server.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r scrapers_py/requirements_server.txt
          pip install psycopg2-binary

      - name: Install Patchright browser (Chromium)
        run: python -m patchright install chromium --with-deps

      - name: Run scrapers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          # Optional overrides — set as secrets if targets change
          APPLE_TRADE_IN_URL: ${{ secrets.APPLE_TRADE_IN_URL }}
          BELL_TRADE_IN_URL: ${{ secrets.BELL_TRADE_IN_URL }}
          BELL_PROXY_AUTH_URL: ${{ secrets.BELL_PROXY_AUTH_URL }}
          BELL_TRADE_IN_BASE_ADDR: ${{ secrets.BELL_TRADE_IN_BASE_ADDR }}
          TELUS_TRADE_IN_URL: ${{ secrets.TELUS_TRADE_IN_URL }}
          TELUS_DEVICES_API_URL: ${{ secrets.TELUS_DEVICES_API_URL }}
          UNIVERCELL_ACTION_URL: ${{ secrets.UNIVERCELL_ACTION_URL }}
          GORECELL_STORE_API: ${{ secrets.GORECELL_STORE_API }}
          GORECELL_PRODUCT_BASE: ${{ secrets.GORECELL_PRODUCT_BASE }}
          # Extend timeouts for GH Actions (slower network than local)
          SCRAPLING_WORKER_TIMEOUT_MS: "240000"
          # Tell workers no subprocess Python needed — they are the subprocess
          SCRAPLING_PYTHON_BIN: "python3"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — skipping DB write"
            python scrapers_py/run_scrapers.py --dry-run 2>&1 || true
          else
            python scrapers_py/run_scrapers.py
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: /tmp/scraper-*.log
          retention-days: 7
